name: Deploy Mandi-Pramaan to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build Frontend with Masked Runtime Credential
        working-directory: ./frontend
        env:
          RAW_SARVAM_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          npm install
          export VITE_SARVAM_RUNTIME_MASK=$(node -e '
            const k = process.env.RAW_SARVAM_KEY || "";
            const salt = "MANDI_PRAMAAN_2026";
            const hex = Buffer.from(k).map((b, i) => b ^ salt.charCodeAt(i % salt.length)).toString("hex");
            process.stdout.write(hex);
          ')
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
